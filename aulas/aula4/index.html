<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="container">
        <h1>Position</h1>
        <div class="relativo">
            <h2>Relative</h2>
        </div>
        <div class="absoluto">
            <h2>Absolute</h2>
        </div>
         <div class="fixo">
            <h2>Fixed</h2>
        </div>
        <div class="block">
            Display Block
            <!-- div podemos ajustar altura e largura -->
        </div>
        <span class="inline">
            Display Inline
            <!-- span NÃO podemos ajustar altura e largura -->
            <!-- só vai ter o tamanho do seu contéudo -->
        </span>
        <div class="inline-block">
            Display Inline-Block
            <!-- div podemos ajustar altura e largura -->
        </div>
        <div class="texto">
            <h1>Exemplo PX</h1>
            <h2>Exemplo REM</h2>
            <p>Lorem ipsum maroto</p>
        </div>
    </main>
    
</body>
</html>
