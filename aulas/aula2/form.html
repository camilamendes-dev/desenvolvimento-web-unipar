<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <fieldset>
        <legend>Registre-se</legend>
        <h4>Informe seus dados para realizar o cadastro na plataforma</h4>
            <form action="url-api-back-end" method="post">
            
                <label for="nome">Informe seu nome</label>
                <input type="text" id="nome" name="nome" 
                    placeholder="Nome" 
                    title="Informe o seu nome completo" 
                    required 
                    maxlength="30"
                    pattern="[A-Za-z ]+">
                <!-- MIN E MAX USADO PARA NUMBER -->

                <br>

                <label for="email">Digite seu email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <br>

                <label for="senha">Digite sua senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="6">
                <br>
                <br>

                <label for="bio">Insira sua biografia</label>
                <br>
                <textarea name="bio" id="bio" 
                    placeholder="Insira sua história..."
                    rows="6" cols="30" style="resize: none;"></textarea>
                <br>
                <br>

                <label for="time">Selecione o melhor time do BR</label>
                <br>
                <select name="melhor-time" id="melhor-time">
                    <option value="" selected disabled>Selecione</option>
                    <optgroup label="Time da série A">
                        <option value="Flamengo">Flamengo</option>
                        <option value="Corinthians">Corinthians</option>
                        <option value="São Paulo">São Paulo</option>
                    </optgroup>
                    <optgroup label="Time Série D">
                        <option value="Coritiba">Coritiba</option>
                        <option value="Cascavel">Cascavel</option>
                    </optgroup>
                </select>
                <br>
                <br>
                <!-- <button onclick="">Enviar</button> -->
                <input type="submit" value="Enviar">

            </form>
    </fieldset>
</body>
</html>
